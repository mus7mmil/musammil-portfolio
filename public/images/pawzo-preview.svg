<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d1e"/>
      <stop offset="50%" stop-color="#1c112b"/>
      <stop offset="100%" stop-color="#0c0714"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg2)" rx="16"/>
  <rect width="798" height="498" x="1" y="1" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" rx="15"/>

  <!-- Glowing background circles -->
  <circle cx="700" cy="140" r="110" fill="#a855f7" opacity="0.14" filter="url(#glow2)"/>
  <circle cx="120" cy="380" r="100" fill="#ec4899" opacity="0.09" filter="url(#glow2)"/>

  <!-- Pet Care App Wireframe Mockup -->
  <g transform="translate(480, 70)">
    <!-- Phone frame -->
    <rect width="240" height="360" rx="32" fill="#0d0815" stroke="#a855f7" stroke-opacity="0.5" stroke-width="2"/>
    <rect width="70" height="12" x="85" y="10" rx="6" fill="#201332"/>
    <!-- Pet profile card -->
    <rect width="200" height="100" x="20" y="38" rx="14" fill="#221239" stroke="#482276" stroke-width="1"/>
    <circle cx="56" cy="80" r="22" fill="#a855f7" opacity="0.5"/>
    <!-- Paw icon shape -->
    <circle cx="56" cy="82" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="48" cy="70" r="3.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="56" cy="67" r="3.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="64" cy="70" r="3.5" fill="#ffffff" opacity="0.8"/>
    <rect width="90" height="9" x="90" y="65" rx="4.5" fill="#ffffff" opacity="0.85"/>
    <rect width="70" height="7" x="90" y="80" rx="3.5" fill="#c2a4ff" opacity="0.6"/>
    <!-- Booking / Services Grid -->
    <rect width="95" height="85" x="20" y="150" rx="10" fill="#1b0e2d"/>
    <circle cx="45" cy="175" r="12" fill="#ec4899" opacity="0.6"/>
    <rect width="60" height="6" x="35" y="200" rx="3" fill="#ffffff" opacity="0.7"/>

    <rect width="95" height="85" x="125" y="150" rx="10" fill="#1b0e2d"/>
    <circle cx="150" cy="175" r="12" fill="#a855f7" opacity="0.6"/>
    <rect width="60" height="6" x="140" y="200" rx="3" fill="#ffffff" opacity="0.7"/>

    <!-- Pet Care Reminder banner -->
    <rect width="200" height="70" x="20" y="250" rx="12" fill="#25123d" stroke="#5d2899" stroke-width="1"/>
    <rect width="120" height="8" x="35" y="272" rx="4" fill="#ffffff" opacity="0.8"/>
    <rect width="150" height="6" x="35" y="290" rx="3" fill="#c2a4ff" opacity="0.5"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(60, 110)">
    <!-- Tag -->
    <rect width="180" height="28" rx="14" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.3"/>
    <text x="14" y="18" fill="#d8b4fe" font-family="'Geist', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">PET CARE CASE STUDY</text>

    <!-- Title -->
    <text x="0" y="80" fill="#ffffff" font-family="'Geist', -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="1">PAWZO</text>
    <text x="0" y="115" fill="url(#accent2)" font-family="'Geist', -apple-system, sans-serif" font-size="20" font-weight="600">Pet Care Mobile App</text>

    <!-- Subtitle -->
    <text x="0" y="155" fill="#b4acbe" font-family="'Geist', -apple-system, sans-serif" font-size="14" font-weight="400">Streamlining Pet Healthcare, Booking &amp; Daily Care</text>
    <text x="0" y="180" fill="#887e95" font-family="'Geist', -apple-system, sans-serif" font-size="13">Figma • Design Systems • User-Centered Design</text>

    <!-- Placeholder Badge note -->
    <g transform="translate(0, 220)">
      <rect width="290" height="42" rx="8" fill="#1b1028" stroke="#a855f7" stroke-opacity="0.4" stroke-dasharray="4,4"/>
      <text x="16" y="26" fill="#d8b4fe" font-family="'Geist', -apple-system, sans-serif" font-size="12" font-weight="500">📷 Ready for Behance Case Study Visuals</text>
    </g>
  </g>
</svg>

