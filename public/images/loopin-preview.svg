<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f1d"/>
      <stop offset="50%" stop-color="#1a1226"/>
      <stop offset="100%" stop-color="#0c0912"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f40ff"/>
      <stop offset="100%" stop-color="#c2a4ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>
  <rect width="798" height="498" x="1" y="1" fill="none" stroke="#7f40ff" stroke-opacity="0.3" stroke-width="1.5" rx="15"/>

  <!-- Glowing accents -->
  <circle cx="680" cy="120" r="100" fill="#7f40ff" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="400" r="120" fill="#c2a4ff" opacity="0.08" filter="url(#glow)"/>

  <!-- Commuter App Mockup Wireframe -->
  <g transform="translate(480, 70)">
    <!-- Phone frame -->
    <rect width="240" height="360" rx="32" fill="#0d0914" stroke="#7f40ff" stroke-opacity="0.5" stroke-width="2"/>
    <rect width="70" height="12" x="85" y="10" rx="6" fill="#1f182b"/>
    <!-- App UI Mock Elements -->
    <rect width="200" height="44" x="20" y="38" rx="10" fill="#1c1529"/>
    <circle cx="42" cy="60" r="12" fill="#7f40ff" opacity="0.6"/>
    <rect width="90" height="8" x="65" y="52" rx="4" fill="#ffffff" opacity="0.8"/>
    <rect width="60" height="6" x="65" y="65" rx="3" fill="#c2a4ff" opacity="0.5"/>
    <!-- Metro line / Route map mockup -->
    <rect width="200" height="110" x="20" y="96" rx="12" fill="#161022" stroke="#3d2a58" stroke-width="1"/>
    <path d="M 40 160 Q 90 120, 140 150 T 200 130" fill="none" stroke="#c2a4ff" stroke-width="3" stroke-dasharray="4,4"/>
    <circle cx="40" cy="160" r="5" fill="#34d399"/>
    <circle cx="140" cy="150" r="5" fill="#7f40ff"/>
    <circle cx="200" cy="130" r="5" fill="#fb8dff"/>
    <!-- Commuter Card List -->
    <rect width="200" height="50" x="20" y="220" rx="10" fill="#1f1730"/>
    <rect width="200" height="50" x="20" y="280" rx="10" fill="#181224"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(60, 110)">
    <!-- Tag -->
    <rect width="180" height="28" rx="14" fill="#7f40ff" fill-opacity="0.15" stroke="#7f40ff" stroke-opacity="0.3"/>
    <text x="14" y="18" fill="#c2a4ff" font-family="'Geist', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">MOBILE UI/UX CASE STUDY</text>

    <!-- Title -->
    <text x="0" y="80" fill="#ffffff" font-family="'Geist', -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="1">LOOPIN</text>
    <text x="0" y="115" fill="url(#accent)" font-family="'Geist', -apple-system, sans-serif" font-size="20" font-weight="600">Bus &amp; Metro Commuter App</text>

    <!-- Subtitle -->
    <text x="0" y="155" fill="#b4acbe" font-family="'Geist', -apple-system, sans-serif" font-size="14" font-weight="400">Public Transit Accessibility &amp; Seamless Navigation</text>
    <text x="0" y="180" fill="#887e95" font-family="'Geist', -apple-system, sans-serif" font-size="13">Figma • User Research • Interactive Prototyping</text>

    <!-- Placeholder Badge note -->
    <g transform="translate(0, 220)">
      <rect width="290" height="42" rx="8" fill="#1c1628" stroke="#7f40ff" stroke-opacity="0.4" stroke-dasharray="4,4"/>
      <text x="16" y="26" fill="#c2a4ff" font-family="'Geist', -apple-system, sans-serif" font-size="12" font-weight="500">📷 Ready for Behance Case Study Visuals</text>
    </g>
  </g>
</svg>

